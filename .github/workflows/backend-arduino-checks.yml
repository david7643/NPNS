name: backend & arduino checks

on:
  pull_request:
    paths:
      - "backend/**"
      - "arduino/**"
      - ".github/workflows/backend-arduino-checks.yml"
  push:
    branches: [master]
    paths:
      - "backend/**"
      - "arduino/**"
      - ".github/workflows/backend-arduino-checks.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system libraries for mediapipe (EGL / OpenGL ES)
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgles2
      - name: Install dependencies (no GPU/TensorFlow needed for unit tests)
        run: |
          grep -v -E '^(tensorflow|opencv-python|matplotlib)\b' requirements.txt > ci-requirements.txt
          pip install -r ci-requirements.txt opencv-python-headless ruff==0.6.9
      - name: Lint Arduino bridge
        run: |
          ruff check --isolated --select E,F,W --line-length 120 \
            app/arduino_bridge.py tests/test_arduino_bridge.py tests/test_detection_session_lifecycle.py
          ruff check --isolated --select F app/detection_service.py
      - name: Unit tests
        run: |
          set -o pipefail
          if ! python -m unittest discover -s tests -v 2>&1 | tee test-output.txt; then
            python - <<'PY'
          import re
          out = open("test-output.txt", encoding="utf-8", errors="replace").read()
          for name in re.findall(r"^(?:ERROR|FAIL): .*$", out, re.M):
              print("::error title=Unit test::" + name)
          tail = "\n".join(out.splitlines()[-80:])
          print("::error title=Unit test output (last 80 lines)::" + tail.replace("%", "%25").replace("\r", "").replace("\n", "%0A"))
          PY
            exit 1
          fi

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tests (no board)
        run: bash arduino/test/run.sh
      - uses: arduino/setup-arduino-cli@v2
      - name: Build for Arduino Uno
        run: |
          arduino-cli core update-index
          arduino-cli core install arduino:avr
          arduino-cli lib install Servo
          arduino-cli compile --fqbn arduino:avr:uno --warnings all arduino/drowsyguard_alarm
